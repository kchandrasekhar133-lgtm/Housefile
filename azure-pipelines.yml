trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:

# 1. Checkout source code
- checkout: self
  displayName: 'Checkout Source Code'

# 2. Setup Python 3.12
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
    addToPath: true
  displayName: 'Setup Python 3.12'

# 3. Prepare SonarQube Analysis
- task: SonarCloudPrepare@3
  inputs:
    SonarCloud: 'SonarCloud-Service'
    organization: 'kchandrasekhar'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: 'kchandrasekhar133-lgtm_Housefile'
    cliProjectName: 'Housefile'
    cliSources: '.'

# 4. Verify Python version
- script: |
    python --version
    python -m pip --version
  displayName: 'Verify Python Version'

# 5. Upgrade pip
- script: |
    python -m pip install --upgrade pip setuptools wheel
  displayName: 'Upgrade pip'

# 6. Install project dependencies
- script: |
    python -m pip install -r requirement.txt
  displayName: 'Install Dependencies'

# 7. Install unit test dependencies
- script: |
    python -m pip install pytest pytest-html pytest-cov
  displayName: 'Install Unit Test Dependencies'

# 8. Verify installed packages
- script: |
    python -c "import numpy; print('NumPy:', numpy.__version__)"
    python -c "import pandas; print('Pandas:', pandas.__version__)"
    python -c "import scipy; print('SciPy:', scipy.__version__)"
    python -c "import sklearn; print('Scikit-learn:', sklearn.__version__)"
    python -c "import flask; print('Flask:', flask.__version__)"
  displayName: 'Verify Dependencies'

# 9. Validate Python code
- script: |
    python -m py_compile app.py
    python -m py_compile house.py
  displayName: 'Validate Python Code'

# 10. Create test result folder
- script: |
    mkdir -p test-results
  displayName: 'Create Test Result Folder'

# 11. Run unit tests with coverage
- script: |
    pytest tests/test_app_50_cases.py \
      -v \
      -ra \
      --cov=. \
      --cov-report=xml \
      --junitxml=test-results/junit.xml \
      --html=test-results/unit-test-report.html \
      --self-contained-html
  displayName: 'Run Unit Tests'
  continueOnError: true

# 12. Publish unit test results
- task: PublishTestResults@2
  condition: always()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'test-results/junit.xml'
    testRunTitle: 'House Price Prediction Unit Tests'
    failTaskOnFailedTests: false
  displayName: 'Publish Unit Test Results'

# 13. Publish HTML report
- task: PublishPipelineArtifact@1
  condition: always()
  inputs:
    targetPath: 'test-results'
    artifact: 'unit-test-report'
    publishLocation: 'pipeline'
  displayName: 'Publish Unit Test Report'

# 14. Run SonarQube Analysis
- task: SonarCloudAnalyze@3
  displayName: 'Run SonarQube Analysis'

# 15. Publish Quality Gate
- task: SonarCloudPublish@3
  inputs:
    pollingTimeoutSec: '300'
  displayName: 'Publish Quality Gate'

# 16. Start Flask application
- script: |
    python app.py &
    sleep 10
    echo "Flask application started successfully"
  displayName: 'Start Flask Application'