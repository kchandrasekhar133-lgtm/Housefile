trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:

# ============================================================
# 1. Checkout Source Code
# ============================================================
- checkout: self
  displayName: 'Checkout Source Code'

# ============================================================
# 2. Setup Python
# ============================================================
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
    addToPath: true
  displayName: 'Setup Python'

# ============================================================
# 3. Install Dependencies
# ============================================================
- script: |
    python -m pip install --upgrade pip
    pip install -r requirement.txt
  displayName: 'Install Dependencies'

# ============================================================
# 4. Verify Python Files
# ============================================================
- script: |
    python -m py_compile app.py
    python -m py_compile house.py
  displayName: 'Validate Python Code'

# ============================================================
# 5. SonarQube Prepare
# ============================================================
- task: SonarCloudPrepare@3
  displayName: 'Prepare SonarQube Analysis'
  inputs:
    SonarCloud: 'SonarCloud-Service'
    organization: 'kchandrasekhar'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: 'kchandrasekhar133-lgtm_Housefile'
    cliProjectName: 'Housefile'
    cliSources: '.'

# ============================================================
# 6. SonarQube Analysis
# ============================================================
- task: SonarCloudAnalyze@3
  displayName: 'Run SonarQube Analysis'

# ============================================================
# 7. SonarQube Quality Gate
# ============================================================
- task: SonarCloudPublish@3
  inputs:
    pollingTimeoutSec: '300'
  displayName: 'Publish Quality Gate'

# ============================================================
# 8. Install Trivy
# ============================================================
- script: |
    sudo apt-get update
    wget -qO - https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
  displayName: 'Install Trivy'

# ============================================================
# 9. Trivy Filesystem Scan
# ============================================================
- script: |
    trivy fs . --severity HIGH,CRITICAL
  displayName: 'Trivy Filesystem Scan'
  continueOnError: true