# Azure DevOps Pipeline for House Price Prediction Project

trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.10'

steps:

# 1. Set up Python
- task: UsePythonVersion@0
  displayName: 'Set up Python'
  inputs:
    versionSpec: '$(pythonVersion)'
    addToPath: true

# 2. Upgrade pip
- script: |
    python -m pip install --upgrade pip
  displayName: 'Upgrade pip'

# 3. Install project dependencies
- script: |
    pip install -r requirement.txt
    pip install pytest pytest-cov pytest-html
  displayName: 'Install Dependencies'

# 4. Create test-results directory
- script: |
    mkdir -p test-results
  displayName: 'Create Test Results Directory'

# 5. Run unit tests
# Exclude the intentionally failing tests (test_36 to test_45)
- script: |
    pytest test_app_50_cases.py -k "not FAIL" \
      --junitxml=test-results/junit.xml \
      --html=test-results/pytest-report.html \
      --self-contained-html
  displayName: 'Run Unit Tests'

# 6. Publish JUnit test results
- task: PublishTestResults@2
  displayName: 'Publish Unit Test Results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'test-results/junit.xml'
    testRunTitle: 'House Price Prediction Unit Tests'
    failTaskOnFailedTests: true

# 7. Publish HTML test report
- task: PublishBuildArtifacts@1
  displayName: 'Publish Test Report'
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: 'test-results'
    ArtifactName: 'Test-Reports'
    publishLocation: 'Container'