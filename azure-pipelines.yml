trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:

# ============================================================
# STAGE 1 - BUILD
# ============================================================

- stage: Build
  displayName: 'Build Application'

  jobs:
  - job: BuildJob
    displayName: 'Python Build'

    steps:

    - checkout: self
      fetchDepth: 0

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
        addToPath: true
      displayName: 'Setup Python'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirement.txt
      displayName: 'Install Dependencies'

    - script: |
        python -m py_compile app.py
        python -m py_compile house.py
      displayName: 'Validate Python Files'

# ============================================================
# STAGE 2 - SONARCLOUD ANALYSIS
# ============================================================

- stage: SonarCloud
  displayName: 'SonarCloud Analysis'

  dependsOn: Build

  jobs:
  - job: SonarAnalysis
    displayName: 'Run SonarCloud'

    steps:

    - checkout: self
      fetchDepth: 0

    - task: SonarCloudPrepare@3
      inputs:
        SonarCloud: 'SonarCloud-Service'
        organization: 'kchandrasekhar'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'kchandrasekhar133-lgtm_Housefile'
        cliProjectName: 'Housefile'
        cliSources: '.'
        extraProperties: |
          sonar.python.version=3.12
          sonar.sourceEncoding=UTF-8
          sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**,**/.venv/**,**/venv/**
      displayName: 'Prepare SonarCloud Analysis'

    - task: SonarCloudAnalyze@3
      displayName: 'Run SonarCloud Analysis'

    - task: SonarCloudPublish@3
      inputs:
        pollingTimeoutSec: '300'
      displayName: 'Publish Quality Gate'

# ============================================================
# STAGE 3 - TRIVY SECURITY SCAN
# ============================================================

- stage: Trivy
  displayName: 'Trivy Security Scan'

  dependsOn: SonarCloud

  jobs:
  - job: TrivyScan
    displayName: 'Run Trivy Scan'

    steps:

    - checkout: self

    - script: |
        sudo apt-get update
        sudo apt-get install wget -y

        wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.66.0_Linux-64bit.deb

        sudo dpkg -i trivy_0.66.0_Linux-64bit.deb

        trivy fs . --severity HIGH,CRITICAL
      displayName: 'Run Trivy File System Scan'

# ============================================================
# STAGE 4 - RUN FLASK APPLICATION
# ============================================================

- stage: RunApp
  displayName: 'Run Flask App'

  dependsOn: Trivy

  jobs:
  - job: StartApplication
    displayName: 'Start Flask'

    steps:

    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
        addToPath: true
      displayName: 'Setup Python'

    - script: |
        pip install -r requirement.txt
      displayName: 'Install Dependencies'

    - script: |
        python app.py &
        sleep 15
        echo "Flask Application Started Successfully"
      displayName: 'Start Flask App'